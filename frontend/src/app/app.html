<div class="min-h-screen relative overflow-hidden">
  
  <!-- Arrière-plan généré style Haikei (Ondes et Blobs) -->
  <svg class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-40 animate-pulse-slow" id="visual" viewBox="0 0 900 600" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="100%" height="100%" fill="#f8fafc"></rect>
    <g transform="translate(0, 0)">
      <path d="M0,457L37.5,437C75,417,150,377,225,387C300,397,375,457,450,477C525,497,600,477,675,447C750,417,825,377,862.5,357L900,337L900,600L862.5,600C825,600,750,600,675,600C600,600,525,600,450,600C375,600,300,600,225,600C150,600,75,600,37.5,600L0,600Z" fill="#ff7096" opacity="0.15"></path>
      <path d="M0,237L37.5,217C75,197,150,157,225,147C300,137,375,157,450,207C525,257,600,337,675,347C750,357,825,297,862.5,267L900,237L900,600L862.5,600C825,600,750,600,675,600C600,600,525,600,450,600C375,600,300,600,225,600C150,600,75,600,37.5,600L0,600Z" fill="#06D6A0" opacity="0.1"></path>
    </g>
  </svg>

  <!-- Navbar Flottante -->
  <nav class="fixed top-0 w-full z-50 p-4 animate-fade-in-up">
    <div class="max-w-7xl mx-auto glass-panel px-6 py-4 flex justify-between items-center transition-all duration-300 hover:shadow-2xl">
      <div class="flex items-center gap-2 cursor-pointer" routerLink="/">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-watermelon-pink to-watermelon-light flex items-center justify-center text-white font-bold text-xl shadow-lg">
          V
        </div>
        <span class="text-2xl font-black tracking-tight text-gray-900">
          Vide<span class="text-gradient">Dressing</span>
        </span>
      </div>

      <!-- Barre de recherche centrale -->
      <div class="hidden md:flex flex-1 max-w-md mx-8 relative">
        <input 
          #searchInput
          (keyup.enter)="onSearch(searchInput.value)"
          type="text" 
          placeholder="Rechercher des articles, marques..." 
          class="w-full bg-white/50 backdrop-blur-sm border border-gray-200/50 rounded-full py-2.5 px-6 text-sm focus:outline-none focus:ring-2 focus:ring-watermelon-pink/50 focus:bg-white transition-all shadow-inner placeholder-gray-400"
        >
        <button 
          (click)="onSearch(searchInput.value)"
          class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-full bg-watermelon-pink text-white hover:bg-watermelon-light transition-colors"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
        </button>
      </div>

      <div class="hidden md:flex items-center gap-4">
        
        <!-- Visiteur -->
        <ng-container *ngIf="!(authService.currentUser$ | async)">
          <a routerLink="/login" class="text-sm font-medium text-gray-600 hover:text-watermelon-pink transition-colors cursor-pointer">Connexion</a>
        </ng-container>

        <!-- Connecté -->
        <ng-container *ngIf="authService.currentUser$ | async as user">
          <a *ngIf="user.is_admin" routerLink="/admin/dashboard" class="flex items-center gap-1 text-sm font-bold text-amber-500 hover:text-amber-600 cursor-pointer mr-2">?? Admin</a>`n          <span class="text-sm font-bold text-gray-900">{{ user.name }}</span>
          <button (click)="authService.logout().subscribe()" class="text-sm font-medium text-gray-500 hover:text-red-500 transition-colors cursor-pointer">Déconnexion</button>
        </ng-container>

        <button routerLink="/dashboard/favorites" class="p-2 text-gray-500 hover:text-watermelon-pink transition-colors cursor-pointer" title="Mes Favoris">`n          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>`n        </button>`n`n        <button routerLink="/dashboard/create" class="px-5 py-2.5 bg-gradient-to-r from-watermelon-pink to-watermelon-light text-white text-sm font-semibold rounded-full shadow-lg hover:shadow-watermelon-pink/30 transform hover:-translate-y-0.5 transition-all">
          Vends tes articles
        </button>
      </div>
    </div>
  </nav>
  <!-- Bottom Tab Bar (Mobile Only) -->
  <nav class="md:hidden fixed bottom-0 w-full z-50 bg-white/80 backdrop-blur-xl border-t border-gray-200 pb-safe shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.1)]">
    <div class="flex justify-around items-center px-2 py-3">
      <!-- Accueil -->
      <a routerLink="/" routerLinkActive="text-watermelon-pink" [routerLinkActiveOptions]="{exact: true}" class="flex flex-col items-center gap-1 text-gray-400 hover:text-watermelon-pink transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
        <span class="text-[10px] font-bold">Accueil</span>
      </a>
      
      <!-- Recherche -->
      <a routerLink="/search" routerLinkActive="text-watermelon-pink" class="flex flex-col items-center gap-1 text-gray-400 hover:text-watermelon-pink transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
        <span class="text-[10px] font-bold">Recherche</span>
      </a>

      <!-- Vendre (Bouton central) -->
      <a routerLink="/dashboard/create" class="flex flex-col items-center justify-center -mt-8">
        <div class="w-14 h-14 bg-gradient-to-tr from-watermelon-pink to-watermelon-light rounded-full flex items-center justify-center shadow-lg shadow-watermelon-pink/40 text-white transform hover:scale-105 transition-transform border-4 border-white">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
        </div>
        <span class="text-[10px] font-bold text-gray-700 mt-1">Vendre</span>
      </a>

      <!-- Favoris -->`n      <a routerLink="/dashboard/favorites" routerLinkActive="text-watermelon-pink" class="flex flex-col items-center gap-1 text-gray-400 hover:text-watermelon-pink transition-colors">`n        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>`n        <span class="text-[10px] font-bold">Favoris</span>`n      </a>`n`n      <!-- Messages -->
      <a routerLink="/dashboard/inbox" routerLinkActive="text-watermelon-pink" class="flex flex-col items-center gap-1 text-gray-400 hover:text-watermelon-pink transition-colors relative">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
        <span class="text-[10px] font-bold">Messages</span>
      </a>

      <!-- Profil -->
      <a routerLink="/dashboard" routerLinkActive="text-watermelon-pink" [routerLinkActiveOptions]="{exact: true}" class="flex flex-col items-center gap-1 text-gray-400 hover:text-watermelon-pink transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
        <span class="text-[10px] font-bold">Profil</span>
      </a>
    </div>
  </nav>

  <!-- Contenu Principal -->
  <main class="pt-32 pb-16 px-4 max-w-7xl mx-auto z-10 relative">
    <router-outlet></router-outlet>
  </main>

</div>
