<!-- 12 Skip to content -->
<a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-0 focus:z-[100] bg-watermelon-pink text-white px-4 py-2">Aller au contenu</a>

<!-- 08 Scroll progress -->
<div class="fixed top-0 left-0 h-1 bg-watermelon-pink z-[60] transition-all duration-150" [style.width.%]="scrollProgress"></div>

<!-- 06 Loading animation -->
<div *ngIf="isLoading" class="fixed top-0 left-0 w-full h-1 bg-watermelon-light z-[70] animate-pulse"></div>

<div class="min-h-screen relative overflow-hidden dark:bg-gray-900 transition-colors duration-300">
  
  <svg class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-40 animate-pulse-slow" id="visual" viewBox="0 0 900 600" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="100%" height="100%" fill="#f8fafc" class="dark:fill-gray-900"></rect>
    <g transform="translate(0, 0)">
      <path d="M0,457L37.5,437C75,417,150,377,225,387C300,397,375,457,450,477C525,497,600,477,675,447C750,417,825,377,862.5,357L900,337L900,600L862.5,600C825,600,750,600,675,600C600,600,525,600,450,600C375,600,300,600,225,600C150,600,75,600,37.5,600L0,600Z" fill="#ff7096" opacity="0.15"></path>
      <path d="M0,237L37.5,217C75,197,150,157,225,147C300,137,375,157,450,207C525,257,600,337,675,347C750,357,825,297,862.5,267L900,237L900,600L862.5,600C825,600,750,600,675,600C600,600,525,600,450,600C375,600,300,600,225,600C150,600,75,600,37.5,600L0,600Z" fill="#06D6A0" opacity="0.1"></path>
    </g>
  </svg>

  <!-- 11 Navbar Flottante (sticky-like behavior) -->
  <nav class="fixed top-0 w-full z-50 p-4 animate-fade-in-up print:hidden">
    <div class="max-w-7xl mx-auto glass-panel dark:bg-gray-800/80 px-6 py-4 flex justify-between items-center transition-all duration-300 hover:shadow-2xl rounded-2xl border border-gray-200/50 dark:border-gray-700/50">
      <div class="flex items-center gap-2 cursor-pointer" routerLink="/">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-watermelon-pink to-watermelon-light flex items-center justify-center text-white font-bold text-xl shadow-lg">
          V
        </div>
        <span class="text-2xl font-black tracking-tight text-gray-900 dark:text-white">
          Vide<span class="text-watermelon-pink">Dressing</span>
        </span>
      </div>

      <!-- 03 Barre de recherche centrale -->
      <div class="hidden md:flex flex-1 max-w-md mx-8 relative">
        <input 
          #searchInput
          (keyup.enter)="onSearch(searchInput.value)"
          type="text" 
          placeholder="Rechercher des articles, marques..." 
          class="w-full bg-white/50 dark:bg-gray-700/50 backdrop-blur-sm border border-gray-200/50 dark:border-gray-600 rounded-full py-2.5 px-6 text-sm focus:outline-none focus:ring-2 focus:ring-watermelon-pink/50 focus:bg-gray-50 dark:focus:bg-gray-800 transition-all shadow-inner placeholder-gray-400 dark:text-white"
        >
        <button 
          (click)="onSearch(searchInput.value)"
          class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-full bg-watermelon-pink text-white hover:bg-watermelon-light transition-colors"
        >
          🔍
        </button>
      </div>

      <div class="hidden md:flex items-center gap-4">
        <!-- 01 Dark mode -->
        <button (click)="toggleDarkMode()" class="p-2 text-xl hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full transition-colors">
          {{ isDarkMode ? '☀️' : '🌙' }}
        </button>

        <ng-container *ngIf="!(authService.currentUser$ | async)">
          <a routerLink="/login" class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-watermelon-pink transition-colors cursor-pointer">Connexion</a>
        </ng-container>

        <ng-container *ngIf="authService.currentUser$ | async as user">
          <a *ngIf="user.is_admin" routerLink="/admin/dashboard" class="flex items-center gap-1 text-sm font-bold text-amber-500 hover:text-amber-600 cursor-pointer mr-2">Admin</a>
          <span class="text-sm font-bold text-gray-900 dark:text-white">{{ user.name }}</span>
          <button (click)="authService.logout().subscribe()" class="text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-red-500 transition-colors cursor-pointer">Déconnexion</button>
        </ng-container>

        <button routerLink="/dashboard/favorites" class="p-2 text-gray-500 dark:text-gray-400 hover:text-watermelon-pink transition-colors cursor-pointer" title="Mes Favoris">
          ❤️
        </button>

        <!-- 07 Effet au survol du bouton (via tailwind classes comme transform hover:-translate-y-0.5 hover:shadow-lg) -->
        <button routerLink="/dashboard/create" class="px-5 py-2.5 bg-gradient-to-r from-watermelon-pink to-watermelon-light text-white text-sm font-semibold rounded-full shadow-md hover:shadow-xl hover:-translate-y-0.5 transition-all">
          Vends tes articles
        </button>
      </div>
    </div>
  </nav>

  <!-- 05 Menu adapté au mobile (Bottom Tab Bar) -->
  <nav class="md:hidden fixed bottom-0 w-full z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-xl border-t border-gray-200 dark:border-gray-700 pb-safe shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.1)] print:hidden">
    <div class="flex justify-around items-center px-2 py-3">
      <a routerLink="/" routerLinkActive="text-watermelon-pink" [routerLinkActiveOptions]="{exact: true}" class="flex flex-col items-center gap-1 text-gray-400 hover:text-watermelon-pink transition-colors">
        🏠
        <span class="text-[10px] font-bold">Accueil</span>
      </a>
      
      <a routerLink="/search" routerLinkActive="text-watermelon-pink" class="flex flex-col items-center gap-1 text-gray-400 hover:text-watermelon-pink transition-colors">
        🔍
        <span class="text-[10px] font-bold">Recherche</span>
      </a>

      <a routerLink="/dashboard/create" class="flex flex-col items-center justify-center -mt-8">
        <div class="w-14 h-14 bg-gradient-to-tr from-watermelon-pink to-watermelon-light rounded-full flex items-center justify-center shadow-lg shadow-watermelon-pink/40 text-white transform hover:scale-105 transition-transform border-4 border-white dark:border-gray-900">
          ➕
        </div>
        <span class="text-[10px] font-bold text-gray-700 dark:text-gray-300 mt-1">Vendre</span>
      </a>

      <a routerLink="/dashboard/favorites" routerLinkActive="text-watermelon-pink" class="flex flex-col items-center gap-1 text-gray-400 hover:text-watermelon-pink transition-colors">
        ❤️
        <span class="text-[10px] font-bold">Favoris</span>
      </a>

      <button (click)="toggleDarkMode()" class="flex flex-col items-center gap-1 text-gray-400 hover:text-watermelon-pink transition-colors">
        {{ isDarkMode ? '☀️' : '🌙' }}
        <span class="text-[10px] font-bold">Thème</span>
      </button>
    </div>
  </nav>

  <!-- Contenu Principal -->
  <main id="main-content" class="pt-32 pb-16 px-4 max-w-7xl mx-auto z-10 relative dark:text-white">
    <div *ngIf="isLoading" class="absolute inset-0 z-[60] flex items-center justify-center bg-white/50 dark:bg-gray-900/50 backdrop-blur-sm rounded-xl">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-watermelon-pink"></div>
    </div>
    <router-outlet></router-outlet>
  </main>

  <!-- 18 Date de dernière mise à jour -->
  <footer class="mt-12 py-8 text-center text-sm text-gray-500 dark:text-gray-400">
    <p>Dernière mise à jour : 25 Septembre 2026</p>
  </footer>

  <!-- 04 Back to top -->
  <button *ngIf="showBackToTop" (click)="scrollToTop()" class="fixed bottom-24 right-4 md:bottom-8 md:right-8 w-12 h-12 bg-gray-800 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-gray-700 transition-all z-50 print:hidden">
    ↑
  </button>

  <!-- 20 Floating contact -->
  <button (click)="openContact()" class="fixed bottom-40 right-4 md:bottom-24 md:right-8 w-12 h-12 bg-blue-500 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-blue-400 transition-all z-50 print:hidden">
    💬
  </button>

  <!-- 02 Cookie banner -->
  <div *ngIf="showCookies" class="fixed bottom-16 md:bottom-0 left-0 w-full bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 p-4 shadow-[0_-10px_20px_rgba(0,0,0,0.1)] z-[100] flex flex-col md:flex-row justify-center items-center gap-4 print:hidden">
    <p class="text-sm text-gray-600 dark:text-gray-300 text-center">Nous utilisons des cookies pour améliorer votre expérience sur VideDressing.</p>
    <button (click)="acceptCookies()" class="bg-watermelon-pink text-white px-6 py-2 rounded-full text-sm hover:bg-watermelon-light font-bold">Compris</button>
  </div>
</div>
